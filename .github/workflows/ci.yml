# Runs on every push and pull request. Free on GitHub Actions. Node 24 matches
# local development (the smoke tests need Node's built-in WebSocket, 22+).
# ubuntu-latest ships Google Chrome.
name: ci

on:
  push:
  pull_request:

jobs:
  # the shipping app: static files, no dependencies to install
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node test.js

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/smoke.mjs

  # the React port (frontend/), until it replaces the app above
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node ../scripts/smoke-frontend.mjs

# Netlify: static site, no dependencies. The "build" only copies what the
# browser needs into dist/, so test.js, serve.js, docs/ and mic-test.html
# (a dev diagnostic with inline script) are never published.
[build]
  command = "rm -rf dist && mkdir dist && cp -r index.html style.css src dist/"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    # esm.sh serves the Anthropic SDK, loaded only when someone uses Claude coaching.
    # 'unsafe-inline' for styles: the markup sets CSS variables in style="" attributes.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://esm.sh; connect-src 'self' https://esm.sh https://api.anthropic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
